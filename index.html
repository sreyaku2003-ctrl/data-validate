<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document & Photo Verification Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      padding: 2.5rem 1.5rem 4rem;
    }

    .page-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .page-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 4px;
    }

    .preset-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn-quick-fill {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-quick-fill:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .btn-quick-fill.accent {
      background: #ede9fe;
      border-color: #c4b5fd;
      color: #6d28d9;
      font-weight: 600;
    }

    .btn-quick-fill.accent:hover {
      background: #ddd6fe;
    }

    /* Category Filter Tabs */
    .category-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.84rem;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .cat-btn.active {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #ffffff;
      font-weight: 600;
    }

    /* Table Card */
    .table-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .docs-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    /* Table Header */
    .docs-table thead th {
      background-color: #f1f5f9;
      color: #475569;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      letter-spacing: 0.02em;
    }

    .docs-table thead th:nth-child(1) { width: 30%; }
    .docs-table thead th:nth-child(2) { width: 32%; }
    .docs-table thead th:nth-child(3) { width: 20%; }
    .docs-table thead th:nth-child(4) { width: 18%; }

    /* Table Rows - Exact warm cream background from user screenshot */
    .docs-table tbody tr {
      background-color: #fffef5;
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.15s ease;
    }

    .docs-table tbody tr:last-child {
      border-bottom: none;
    }

    .docs-table tbody tr:hover {
      background-color: #fffdf0;
    }

    .docs-table td {
      padding: 1.15rem 1.5rem;
      vertical-align: middle;
    }

    /* Column 1: Document Name */
    .doc-name-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .doc-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: #0f172a;
    }

    .doc-type-hint {
      font-size: 0.74rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Column 2: Status */
    .status-cell {
      font-size: 0.92rem;
    }

    .status-not-uploaded {
      color: #64748b;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .status-badge.approved {
      background-color: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .status-badge.rejected {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .status-badge.loading {
      background-color: #f8fafc;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    .status-message {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.4;
      max-width: 320px;
    }

    .status-message.error {
      color: #b91c1c;
    }

    .status-message.success {
      color: #047857;
    }

    /* Column 3: Upload Box - Rounded dashed card with purple cloud icon */
    .upload-box {
      width: 140px;
      height: 72px;
      background: #ffffff;
      border: 1.5px dashed #c4b5fd;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-box:hover, .upload-box.dragover {
      border-color: #7c3aed;
      background: #fbf9ff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
    }

    .upload-icon {
      width: 24px;
      height: 24px;
      color: #7c3aed;
      margin-bottom: 4px;
      transition: transform 0.2s ease;
    }

    .upload-box:hover .upload-icon {
      transform: translateY(-2px);
    }

    .upload-text {
      font-size: 0.75rem;
      font-weight: 500;
      color: #475569;
    }

    /* Thumbnail or File Preview */
    .preview-box {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: #ffffff;
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-doc-icon {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #dc2626;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .preview-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .upload-box:hover .preview-overlay {
      opacity: 1;
    }

    /* Column 4: Actions */
    .actions-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .action-btn.btn-danger:hover {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }

    .action-btn.btn-inspect {
      color: #6d28d9;
      border-color: #ddd6fe;
      background: #fbf9ff;
    }

    .action-btn.btn-inspect:hover {
      background: #ede9fe;
    }

    .empty-actions-dash {
      color: #cbd5e1;
      font-size: 1.1rem;
      padding-left: 8px;
    }

    /* Modal for Inspection / Preview */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }

    .modal-dialog {
      background: #ffffff;
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: #94a3b8;
      cursor: pointer;
    }

    .modal-close:hover { color: #0f172a; }

    .modal-body {
      padding: 1.5rem;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-image-preview {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      background: #0f172a;
      margin-bottom: 1rem;
    }

    /* Hidden file inputs */
    .hidden-input {
      display: none;
    }

    /* Bottom Summary Bar */
    .summary-card {
      margin-top: 1.5rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .summary-text {
      font-size: 0.9rem;
      color: #475569;
    }

    .summary-text strong {
      color: #0f172a;
    }

    .btn-submit {
      background: #7c3aed;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background: #6d28d9;
    }
  </style>
</head>
<body>
  <div class="page-container">
    
    <!-- Top Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Document & Photo Verification</h1>
        <p class="page-subtitle">Upload family photos, Aadhaar cards, and certificates (PDF, DOCX, or Image).</p>
      </div>

      <div class="preset-toolbar">
        <span class="toolbar-label">Quick Test:</span>
        <button class="btn-quick-fill accent" onclick="testValidBirthCert()">Test Valid Birth Cert</button>
        <button class="btn-quick-fill" onclick="testRandomInBirthCert()">Test Random Doc in Birth Cert</button>
        <button class="btn-quick-fill accent" onclick="testValidTC()">Test Valid TC</button>
        <button class="btn-quick-fill" onclick="testRandomInTC()">Test Random Doc in TC</button>
        <button class="btn-quick-fill" onclick="testValidAadhaar()">Test Valid Aadhaar</button>
        <button class="btn-quick-fill" onclick="resetAllFields()">Reset All</button>
      </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-nav">
      <button class="cat-btn active" onclick="filterCategory('all', this)">All Documents (17)</button>
      <button class="cat-btn" onclick="filterCategory('aadhar', this)">Aadhaar Cards (3)</button>
      <button class="cat-btn" onclick="filterCategory('photo', this)">Photos & Signatures (5)</button>
      <button class="cat-btn" onclick="filterCategory('academic', this)">Academic & School Certificates (5)</button>
      <button class="cat-btn" onclick="filterCategory('category', this)">Category & Other Proofs (4)</button>
    </div>

    <!-- Main Table Card -->
    <div class="table-card">
      <table class="docs-table">
        <thead>
          <tr>
            <th>Document Name</th>
            <th>Status</th>
            <th>Upload</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dynamically populated or rendered rows -->
        </tbody>
      </table>
    </div>

    <!-- Summary Bar -->
    <div class="summary-card">
      <div class="summary-text" id="summaryStatusText">
        Uploaded: <strong>0 / 17</strong> documents verified
      </div>
      <button class="btn-submit" onclick="checkAllAndSubmit()">Submit All Documents</button>
    </div>

  </div>

  <!-- Modal for Inspection & Image View -->
  <div class="modal-overlay" id="inspectModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modalDocTitle">Document Details</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="modalPreviewArea" style="text-align: center; margin-bottom: 1rem;">
          <img id="modalPreviewImg" class="modal-image-preview" src="" alt="Preview" style="display:none;" />
          <div id="modalDocBadge" style="display:none; padding: 2rem; background: #f8fafc; border-radius: 8px; font-weight: 600; color: #64748b;">
            📄 PDF / Document File Verified
          </div>
        </div>
        
        <div id="modalVerdictBox" style="padding: 10px 14px; border-radius: 8px; margin-bottom: 1rem;">
          <div id="modalVerdictTitle" style="font-weight: 700; font-size: 0.95rem;"></div>
          <div id="modalVerdictMsg" style="font-size: 0.82rem; margin-top: 4px; line-height: 1.4;"></div>
        </div>

        <div id="modalDetailsText" style="font-size: 0.82rem; color: #64748b; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; line-height: 1.5;">
          Content extracted & verified by AI validation engine.
        </div>
      </div>
    </div>
  </div>

  <script>
    // Master list of all documents requested
    var documentsConfig = [
      // 1. Photos & Signatures
      { id: "father_photo", title: "Father Photo", expected: "person", category: "photo", hint: "Required: Person Photo (JPG/PNG)" },
      { id: "father_sig", title: "Father Signature", expected: "signature", category: "photo", hint: "Required: Signature (JPG/PNG)" },
      { id: "mother_photo", title: "Mother Photo", expected: "person", category: "photo", hint: "Required: Person Photo (JPG/PNG)" },
      { id: "mother_sig", title: "Mother Signature", expected: "signature", category: "photo", hint: "Required: Signature (JPG/PNG)" },
      { id: "student_photo", title: "Student Photo", expected: "person", category: "photo", hint: "Required: Person Photo (JPG/PNG)" },

      // 2. Aadhaar Cards
      { id: "student_aadhar", title: "Student Aadhar Card", expected: "student_aadhar", category: "aadhar", hint: "Required: Aadhaar Card (PDF / Image)" },
      { id: "father_aadhar", title: "Father Aadhar Card", expected: "father_aadhar", category: "aadhar", hint: "Required: Aadhaar Card (PDF / Image)" },
      { id: "mother_aadhar", title: "Mother Aadhar Card", expected: "mother_aadhar", category: "aadhar", hint: "Required: Aadhaar Card (PDF / Image)" },

      // 3. Academic & School Certificates
      { id: "birth_cert", title: "Birth Certificate", expected: "birth_certificate", category: "academic", hint: "Required: Birth Certificate (PDF / Image)" },
      { id: "tc", title: "Transfer Certificate (TC)", expected: "tc", category: "academic", hint: "Original from previous school (PDF / Image)" },
      { id: "marksheet", title: "Previous Examination Marksheet / Report Card", expected: "marksheet", category: "academic", hint: "Report Card / Statement of Marks (PDF / Image)" },
      { id: "study_cert", title: "Study & Conduct Certificate", expected: "study_certificate", category: "academic", hint: "Bonafide / Study Certificate (PDF / Image)" },
      { id: "migration_cert", title: "Migration Certificate", expected: "migration_certificate", category: "academic", hint: "Board / Council Certificate (PDF / Image)" },

      // 4. Category & Other Proofs
      { id: "caste_cert", title: "Caste Certificate", expected: "caste_certificate", category: "category", hint: "Community Certificate (PDF / Image)" },
      { id: "income_cert", title: "Income Certificate", expected: "income_certificate", category: "category", hint: "Annual Family Income Certificate (PDF / Image)" },
      { id: "medical_cert", title: "Medical / Health / Vaccination Certificate", expected: "medical_certificate", category: "category", hint: "Fitness / Immunization Record (PDF / Image)" },
      { id: "address_proof", title: "Address Proof / Ration Card / Utility Bill", expected: "address_proof", category: "category", hint: "Electricity Bill, Ration Card, etc. (PDF / Image)" }
    ];

    var rowData = {};

    function renderTableRows() {
      var tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      documentsConfig.forEach(function(doc) {
        if (!rowData[doc.id]) {
          rowData[doc.id] = {
            id: doc.id,
            title: doc.title,
            expected: doc.expected,
            category: doc.category,
            result: null,
            file: null,
            previewUrl: null,
            isPdf: false
          };
        }

        var tr = document.createElement("tr");
        tr.id = "row_" + doc.id;
        tr.setAttribute("data-category", doc.category);

        tr.innerHTML = `
          <td>
            <div class="doc-name-cell">
              <span class="doc-title">${doc.title}</span>
              <span class="doc-type-hint">${doc.hint}</span>
            </div>
          </td>
          <td>
            <div class="status-cell" id="status_${doc.id}">
              <span class="status-not-uploaded">Not Uploaded</span>
            </div>
          </td>
          <td>
            <div class="upload-box" id="box_${doc.id}" onclick="triggerFileSelect('${doc.id}')">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
                <path d="M12 13v6"></path>
                <path d="m9 16 3 3 3-3"></path>
              </svg>
              <span class="upload-text">Click to upload</span>
              <div class="preview-box" id="prevbox_${doc.id}">
                <img class="preview-img" id="img_${doc.id}" alt="${doc.title}" style="display:none;" />
                <div class="preview-doc-icon" id="pdfbadge_${doc.id}" style="display:none;">
                  <span style="font-size: 1.4rem;">📄</span>
                  <span>PDF FILE</span>
                </div>
                <div class="preview-overlay">Replace</div>
              </div>
            </div>
            <input type="file" id="file_${doc.id}" class="hidden-input" accept="image/jpeg,image/png,image/webp,application/pdf,.doc,.docx" onchange="onFileChosen(event, '${doc.id}')" />
          </td>
          <td>
            <div class="actions-cell" id="actions_${doc.id}">
              <span class="empty-actions-dash">—</span>
            </div>
          </td>
        `;

        tbody.appendChild(tr);

        // Bind drag and drop
        setTimeout(function() {
          var box = document.getElementById("box_" + doc.id);
          if (box) {
            box.addEventListener("dragover", function(e) { e.preventDefault(); box.classList.add("dragover"); });
            box.addEventListener("dragleave", function() { box.classList.remove("dragover"); });
            box.addEventListener("drop", function(e) {
              e.preventDefault();
              box.classList.remove("dragover");
              if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                uploadAndValidate(doc.id, e.dataTransfer.files[0]);
              }
            });
          }
        }, 10);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll(".cat-btn").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");

      document.querySelectorAll("#tableBody tr").forEach(function(row) {
        if (cat === "all" || row.getAttribute("data-category") === cat) {
          row.style.display = "";
        } else {
          row.style.display = "none";
        }
      });
    }

    function triggerFileSelect(id) {
      document.getElementById("file_" + id).click();
    }

    function onFileChosen(event, id) {
      if (event.target.files && event.target.files.length > 0) {
        uploadAndValidate(id, event.target.files[0]);
      }
    }

    async function uploadAndValidate(id, file) {
      var item = rowData[id];
      var isPdf = file.name.toLowerCase().endsWith(".pdf") || file.type === "application/pdf";
      var isDocx = file.name.toLowerCase().endsWith(".docx") || file.name.toLowerCase().endsWith(".doc");

      item.file = file;
      item.isPdf = isPdf || isDocx;

      var prevbox = document.getElementById("prevbox_" + id);
      var img = document.getElementById("img_" + id);
      var pdfBadge = document.getElementById("pdfbadge_" + id);

      if (isPdf || isDocx) {
        img.style.display = "none";
        pdfBadge.style.display = "flex";
        pdfBadge.querySelector("span:last-child").textContent = isPdf ? "PDF FILE" : "DOCX FILE";
        item.previewUrl = null;
      } else {
        var previewUrl = URL.createObjectURL(file);
        item.previewUrl = previewUrl;
        img.src = previewUrl;
        img.style.display = "block";
        pdfBadge.style.display = "none";
      }
      prevbox.style.display = "block";

      // Status: Analyzing
      var statusCell = document.getElementById("status_" + id);
      statusCell.innerHTML = '<span class="status-badge loading">Analyzing Document...</span>';

      // Send to Backend
      var formData = new FormData();
      formData.append("file", file);
      formData.append("doc_type", item.expected);
      formData.append("field_name", id);

      try {
        var resp = await fetch("/api/validate", {
          method: "POST",
          body: formData
        });
        var data = await resp.json();
        item.result = data;

        renderRowStatus(id, data);
        updateSummary();
      } catch (err) {
        statusCell.innerHTML = '<span class="status-badge rejected">Validation Failed</span><div class="status-message error">' + err.message + '</div>';
      }
    }

    function renderRowStatus(id, data) {
      var statusCell = document.getElementById("status_" + id);
      var actionsCell = document.getElementById("actions_" + id);

      if (data.allowed) {
        statusCell.innerHTML = '<span class="status-badge approved">✅ ' + (data.badgeText || 'Approved') + '</span><div class="status-message success">' + data.message + '</div>';
      } else {
        statusCell.innerHTML = '<span class="status-badge rejected">❌ ' + (data.badgeText || 'Rejected') + '</span><div class="status-message error">' + data.message + '</div>';
      }

      actionsCell.innerHTML = '<button class="action-btn btn-inspect" onclick="inspectRow(\'' + id + '\')" title="Inspect Metrics">Details</button> <button class="action-btn btn-danger" onclick="clearRow(\'' + id + '\')" title="Remove">Clear</button>';
    }

    function clearRow(id) {
      var item = rowData[id];
      item.file = null;
      item.result = null;
      item.previewUrl = null;

      document.getElementById("prevbox_" + id).style.display = "none";
      document.getElementById("file_" + id).value = "";
      document.getElementById("status_" + id).innerHTML = '<span class="status-not-uploaded">Not Uploaded</span>';
      document.getElementById("actions_" + id).innerHTML = '<span class="empty-actions-dash">—</span>';
      updateSummary();
    }

    function resetAllFields() {
      Object.keys(rowData).forEach(function(id) { clearRow(id); });
    }

    function updateSummary() {
      var count = 0;
      var approvedCount = 0;
      var total = Object.keys(rowData).length;

      Object.values(rowData).forEach(function(item) {
        if (item.result) {
          count++;
          if (item.result.allowed) approvedCount++;
        }
      });

      var summaryText = document.getElementById("summaryStatusText");
      if (approvedCount === total) {
        summaryText.innerHTML = '<span style="color: #059669; font-weight: 600;">All ' + total + ' documents verified & approved!</span>';
      } else {
        summaryText.innerHTML = 'Uploaded: <strong>' + count + ' / ' + total + '</strong> | Approved: <strong style="color: ' + (approvedCount > 0 ? '#059669' : '#0f172a') + '">' + approvedCount + '</strong>';
      }
    }

    function inspectRow(id) {
      var item = rowData[id];
      if (!item || !item.result) return;

      var modal = document.getElementById("inspectModal");
      document.getElementById("modalDocTitle").textContent = item.title + " Verification";

      var modalImg = document.getElementById("modalPreviewImg");
      var modalDocBadge = document.getElementById("modalDocBadge");

      if (item.previewUrl) {
        modalImg.src = item.previewUrl;
        modalImg.style.display = "block";
        modalDocBadge.style.display = "none";
      } else {
        modalImg.style.display = "none";
        modalDocBadge.style.display = "block";
        modalDocBadge.textContent = "📄 " + (item.file ? item.file.name : "Document File");
      }

      var vBox = document.getElementById("modalVerdictBox");
      var vTitle = document.getElementById("modalVerdictTitle");
      var vMsg = document.getElementById("modalVerdictMsg");

      if (item.result.allowed) {
        vBox.style.background = "#ecfdf5";
        vBox.style.border = "1px solid #a7f3d0";
        vTitle.style.color = "#059669";
        vTitle.textContent = "✅ " + item.result.badgeText;
        vMsg.style.color = "#047857";
      } else {
        vBox.style.background = "#fef2f2";
        vBox.style.border = "1px solid #fecaca";
        vTitle.style.color = "#dc2626";
        vTitle.textContent = "❌ " + item.result.badgeText;
        vMsg.style.color = "#b91c1c";
      }
      vMsg.textContent = item.result.message;

      var detailsText = document.getElementById("modalDetailsText");
      detailsText.textContent = "Detected Type: " + item.result.detectedType + " | Confidence: " + Math.round(item.result.confidence * 100) + "% | Field: " + item.expected;

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("inspectModal").style.display = "none";
    }

    window.onclick = function(event) {
      var modal = document.getElementById("inspectModal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    };

    // Quick Test Functions
    async function loadSampleBlob(filename) {
      var resp = await fetch("/samples/" + filename);
      var blob = await resp.blob();
      return new File([blob], filename, { type: blob.type || (filename.endsWith('.pdf') ? 'application/pdf' : 'image/png') });
    }

    async function testValidBirthCert() {
      var birthPdf = await loadSampleBlob("sample_birth_certificate.pdf");
      await uploadAndValidate("birth_cert", birthPdf);
    }

    async function testRandomInBirthCert() {
      // Upload random document (e.g. utility bill) to Birth Certificate - MUST BE REJECTED!
      var billPdf = await loadSampleBlob("sample_utility_bill.pdf");
      await uploadAndValidate("birth_cert", billPdf);
    }

    async function testValidTC() {
      var tcPdf = await loadSampleBlob("sample_transfer_certificate.pdf");
      await uploadAndValidate("tc", tcPdf);
    }

    async function testRandomInTC() {
      // Upload random document to TC - MUST BE REJECTED!
      var billPdf = await loadSampleBlob("sample_utility_bill.pdf");
      await uploadAndValidate("tc", billPdf);
    }

    async function testValidAadhaar() {
      var aadhaarPdf = await loadSampleBlob("sample_aadhaar.pdf");
      await uploadAndValidate("student_aadhar", aadhaarPdf);
      await uploadAndValidate("father_aadhar", aadhaarPdf);
      await uploadAndValidate("mother_aadhar", aadhaarPdf);
    }

    async function testWrongAadhaarUpload() {
      // Upload utility bill to Student Aadhar (should reject!)
      var billPdf = await loadSampleBlob("sample_utility_bill.pdf");
      await uploadAndValidate("student_aadhar", billPdf);
    }

    async function testPhotoInAadhaar() {
      // Upload person portrait photo to Father Aadhar (should reject with photo detected!)
      var photo = await loadSampleBlob("person_portrait.png");
      await uploadAndValidate("father_aadhar", photo);
    }

    function checkAllAndSubmit() {
      var unapproved = [];
      Object.keys(rowData).forEach(function(id) {
        var item = rowData[id];
        if (!item.result || !item.result.allowed) {
          unapproved.push(item.title);
        }
      });

      if (unapproved.length === 0) {
        alert("Success! All documents passed AI verification and are ready for submission.");
      } else {
        alert("Cannot submit:\nThe following documents are either missing or were rejected by AI:\n• " + unapproved.join("\n• "));
      }
    }

    // Initialize Table
    renderTableRows();
  </script>
